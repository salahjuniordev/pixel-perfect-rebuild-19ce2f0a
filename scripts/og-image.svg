<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Brand OG card: navy background, soft brand glows, name + role + stack -->
  <defs>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120,40) scale(700)">
      <stop offset="0" stop-color="#9bfa06" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#9bfa06" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080,600) scale(650)">
      <stop offset="0" stop-color="#9bfa06" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#9bfa06" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9bfa06"/>
      <stop offset="1" stop-color="#3fbf3f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#07101f"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect x="12" y="12" width="1176" height="606" fill="none" stroke="#9bfa06" stroke-opacity="0.22" stroke-width="2" rx="24"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="205" font-size="34" font-weight="600" letter-spacing="10" fill="#9bfa06">SALAHJUNIORDEV</text>
    <text x="80" y="292" font-size="76" font-weight="700" fill="#ffffff">Salah Junior</text>
    <text x="80" y="372" font-size="40" font-weight="500" fill="#b7c3d6">Full-Stack Web Developer, Yaoundé</text>
    <rect x="80" y="424" width="210" height="8" rx="4" fill="url(#accent)"/>
    <text x="80" y="492" font-size="27" fill="#8fa0b5">Fast, bilingual websites &amp; web apps — Cameroon &amp; beyond</text>
  </g>

  <g>
    <circle cx="945" cy="315" r="128" fill="#0b1626" stroke="#9bfa06" stroke-opacity="0.35" stroke-width="2"/>
    <text x="945" y="360" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700" fill="#9bfa06">SJ</text>
  </g>
</svg>
